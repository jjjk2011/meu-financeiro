<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financeiro Pro - Gestão Total</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-900 p-4">

    <div class="max-w-6xl mx-auto">
        <div class="bg-slate-800 text-white p-6 mb-6 rounded-3xl flex flex-wrap justify-between items-center gap-4 shadow-xl">
            <div>
                <h1 class="font-black text-xl text-emerald-400 uppercase">Financeiro Pro</h1>
                <p class="text-[10px] opacity-60 uppercase tracking-widest">Controlo de Backup e Listas</p>
            </div>
            <div class="flex gap-3">
                <button onclick="exportarBackup()" class="bg-emerald-600 hover:bg-emerald-700 px-5 py-2.5 rounded-2xl text-xs font-bold transition uppercase">Exportar</button>
                <label class="bg-blue-600 hover:bg-blue-700 px-5 py-2.5 rounded-2xl text-xs font-bold cursor-pointer transition uppercase text-center">
                    Importar Backup
                    <input type="file" class="hidden" onchange="importarBackup(event)">
                </label>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            
            <div class="lg:col-span-1 space-y-6">
                <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200 text-center">
                    <p class="text-[10px] font-bold text-slate-400 uppercase mb-4 text-left">Resumo Mensal</p>
                    <div class="grid grid-cols-2 gap-2 mb-4">
                        <div class="bg-emerald-50 p-3 rounded-2xl">
                            <span class="block text-[9px] text-emerald-600 font-bold uppercase">Entradas</span>
                            <span id="totalIncome" class="font-bold text-sm text-emerald-700">R$ 0,00</span>
                        </div>
                        <div class="bg-rose-50 p-3 rounded-2xl">
                            <span class="block text-[9px] text-rose-600 font-bold uppercase">Saídas</span>
                            <span id="totalExpense" class="font-bold text-sm text-rose-700">R$ 0,00</span>
                        </div>
                    </div>
                    <div class="pt-2 border-t">
                        <span class="text-[10px] text-slate-400 font-bold uppercase">Saldo em Conta</span>
                        <h2 id="totalBalance" class="text-2xl font-black text-slate-900">R$ 0,00</h2>
                    </div>
                </div>

                <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200">
                    <h3 class="font-bold mb-4 text-slate-800 border-b pb-2">Novo Lançamento</h3>
                    <div class="space-y-3">
                        <select id="inType" class="w-full p-3 bg-slate-50 border rounded-2xl text-sm outline-none">
                            <option value="income">Receita (+)</option>
                            <option value="expense" selected>Despesa (-)</option>
                        </select>
                        <input id="inDesc" type="text" placeholder="Descrição" class="w-full p-3 bg-slate-50 border rounded-2xl text-sm outline-none font-medium">
                        <div class="grid grid-cols-2 gap-2">
                            <input id="inVal" type="number" placeholder="Valor R$" class="p-3 bg-slate-50 border rounded-2xl text-sm outline-none">
                            <input id="inParc" type="number" placeholder="Parc. (1)" class="p-3 bg-slate-50 border rounded-2xl text-sm outline-none">
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <select id="inCat" class="p-3 bg-slate-50 border rounded-2xl text-[11px] outline-none"></select>
                            <select id="inMeth" class="p-3 bg-slate-50 border rounded-2xl text-[11px] outline-none"></select>
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <select id="inMonth" class="p-3 bg-slate-50 border rounded-2xl text-[11px] outline-none"></select>
                            <input id="inYear" type="number" class="p-3 bg-slate-50 border rounded-2xl text-[11px] outline-none">
                        </div>
                        <button onclick="adicionar()" class="w-full bg-slate-900 text-white font-bold py-4 rounded-2xl hover:bg-black transition shadow-lg text-xs uppercase tracking-widest mt-2">Salvar Registro</button>
                    </div>
                </div>

                <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200 space-y-5">
                    <div>
                        <p class="text-[10px] font-black text-slate-400 uppercase mb-3 tracking-tighter">Gerenciar Categorias</p>
                        <div class="flex gap-1 mb-3">
                            <input id="newCatInput" type="text" placeholder="Ex: Mercado" class="flex-grow p-2 bg-slate-50 border rounded-xl text-xs outline-none">
                            <button onclick="addItemLista('categorias', 'newCatInput')" class="bg-emerald-500 text-white px-4 rounded-xl font-black hover:bg-emerald-600">+</button>
                        </div>
                        <div id="catListUI" class="flex flex-wrap gap-2 max-h-32 overflow-y-auto p-1"></div>
                    </div>

                    <div class="pt-4 border-t">
                        <p class="text-[10px] font-black text-slate-400 uppercase mb-3 tracking-tighter">Gerenciar Bancos/Cartões</p>
                        <div class="flex gap-1 mb-3">
                            <input id="newMethInput" type="text" placeholder="Ex: Nubank" class="flex-grow p-2 bg-slate-50 border rounded-xl text-xs outline-none">
                            <button onclick="addItemLista('metodos', 'newMethInput')" class="bg-blue-500 text-white px-4 rounded-xl font-black hover:bg-blue-600">+</button>
                        </div>
                        <div id="methListUI" class="flex flex-wrap gap-2 max-h-32 overflow-y-auto p-1"></div>
                    </div>
                </div>
            </div>

            <div class="lg:col-span-2 bg-white p-6 md:p-8 rounded-3xl shadow-sm border border-slate-200">
                <div class="flex flex-wrap justify-between items-center mb-6 gap-3 border-b pb-4">
                    <h3 class="font-bold text-lg text-slate-800">Histórico de Lançamentos</h3>
                    <div class="flex items-center gap-2">
                        <select id="fMonth" onchange="render()" class="p-2 border rounded-xl text-xs bg-slate-50 outline-none font-bold"></select>
                        <input id="fYear" type="number" onchange="render()" class="p-2 border rounded-xl text-xs w-20 bg-slate-50 outline-none font-bold">
                        <button onclick="limparTudo()" class="text-rose-500 font-black text-[10px] hover:bg-rose-50 px-3 py-2 rounded-xl transition border border-rose-100 uppercase">Apagar Tudo</button>
                    </div>
                </div>
                
                <div class="overflow-x-auto">
                    <table class="w-full text-left">
                        <thead>
                            <tr class="text-[10px] text-slate-300 uppercase font-black tracking-widest">
                                <th class="pb-3 text-center w-12">Pago</th>
                                <th class="pb-3">Descrição / Info</th>
                                <th class="pb-3 text-right">Valor</th>
                                <th class="pb-3 text-right w-12">Ação</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody" class="divide-y divide-slate-50"></tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
