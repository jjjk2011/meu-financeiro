<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financeiro Pro Cloud - Gestão Financeira</title>
    <meta name="description" content="Sistema de gestão financeira pessoal na nuvem">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { 
            darkMode: 'class',
            theme: {
                extend: {
                    animation: {
                        'slide-up': 'slideUp 0.3s ease-out',
                        'pulse-slow': 'pulse 2s infinite'
                    },
                    keyframes: {
                        slideUp: {
                            '0%': { transform: 'translateY(100%)', opacity: '0' },
                            '100%': { transform: 'translateY(0)', opacity: '1' }
                        }
                    }
                }
            }
        }
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        }
    </script>
    <style>
        #authScreen { display: flex; }
        #appScreen { display: none; }
        .loading-btn {
            position: relative;
            color: transparent !important;
            pointer-events: none;
        }
        .loading-btn::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            top: 50%;
            left: 50%;
            margin: -10px 0 0 -10px;
            border: 3px solid white;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .glass-effect {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
        }
        .dark .glass-effect {
            background: rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 transition-colors duration-300 font-sans antialiased">

    <!-- Tela de Autenticação -->
    <div id="authScreen" class="fixed inset-0 bg-gradient-to-br from-slate-900 to-slate-800 z-50 flex items-center justify-center p-4">
        <div class="bg-white/95 backdrop-blur-sm p-8 rounded-3xl shadow-2xl max-w-sm w-full text-center transform transition-all animate-slide-up">
            <div class="mb-6">
                <h1 class="font-black text-3xl text-slate-800 mb-1">💰</h1>
                <h1 class="font-black text-2xl text-slate-800 mb-2 uppercase tracking-tight">Financeiro Pro</h1>
                <p class="text-[10px] text-slate-400 uppercase font-bold tracking-widest">Cloud Edition</p>
            </div>
            
            <input id="authEmail" type="email" placeholder="E-mail" value="teste@email.com"
                   class="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl mb-3 outline-none text-sm text-slate-800 focus:border-emerald-500 transition">
            <input id="authPass" type="password" placeholder="Senha" value="123456"
                   class="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl mb-4 outline-none text-sm text-slate-800 focus:border-emerald-500 transition">
            
            <div class="flex gap-2 mb-3">
                <button onclick="handleLogin()" class="flex-grow bg-emerald-600 text-white font-bold py-4 rounded-2xl hover:bg-emerald-700 transition text-xs uppercase tracking-wider shadow-lg hover:shadow-xl">
                    Entrar
                </button>
                <button onclick="handleSignup()" class="flex-grow bg-slate-100 text-slate-600 font-bold py-4 rounded-2xl hover:bg-slate-200 transition text-xs uppercase tracking-wider">
                    Cadastrar
                </button>
            </div>
            
            <p class="text-[10px] text-slate-400 mt-4">
                Use qualquer e-mail/senha para teste
            </p>
        </div>
    </div>

    <!-- App Principal -->
    <div id="appScreen" class="min-h-screen">
        <div class="p-4 md:p-8 max-w-7xl mx-auto">
            
            <!-- Header -->
            <div class="bg-gradient-to-r from-slate-800 to-slate-900 text-white p-6 mb-6 rounded-3xl flex flex-wrap justify-between items-center gap-4 shadow-2xl">
                <div>
                    <h1 class="font-black text-2xl text-emerald-400 uppercase tracking-tighter flex items-center gap-2">
                        ☁️ Cloud Finance
                        <span class="text-[8px] bg-emerald-500/20 text-emerald-300 px-2 py-1 rounded-full">BETA</span>
                    </h1>
                    <p id="userDisplay" class="text-[10px] opacity-60 uppercase font-bold tracking-widest mt-1"></p>
                </div>
                <div class="flex flex-wrap gap-2">
                    <button onclick="toggleDarkMode()" class="bg-slate-700 hover:bg-slate-600 px-4 py-3 rounded-xl text-sm transition-all hover:scale-105" title="Alternar tema">
                        🌓
                    </button>
                    <button onclick="exportarPDF()" class="bg-emerald-600 hover:bg-emerald-700 px-5 py-3 rounded-xl text-[10px] font-bold uppercase tracking-wider transition-all hover:scale-105 shadow-lg flex items-center gap-1">
                        📄 PDF
                    </button>
                    <button onclick="handleLogout()" class="bg-rose-600 hover:bg-rose-700 px-5 py-3 rounded-xl text-[10px] font-bold uppercase tracking-wider transition-all hover:scale-105 shadow-lg flex items-center gap-1">
                        ⏻ Sair
                    </button>
                </div>
            </div>

            <!-- Grid Principal -->
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <!-- Coluna Esquerda - Formulário -->
                <div class="lg:col-span-1 space-y-6">
                    <!-- Formulário -->
                    <div class="bg-white dark:bg-slate-900 p-6 rounded-3xl shadow-xl border border-slate-200 dark:border-slate-800">
                        <div class="flex justify-between items-center mb-4">
                            <h3 id="formTitle" class="font-bold text-slate-800 dark:text-slate-200 uppercase text-[10px] tracking-widest">
                                Novo Registro
                            </h3>
                            <span class="text-[8px] bg-slate-100 dark:bg-slate-800 px-2 py-1 rounded-full">
                                Ctrl+N
                            </span>
                        </div>
                        
                        <div class="space-y-3">
                            <input type="hidden" id="editId">
                            
                            <select id="inType" class="w-full p-3 bg-slate-50 dark:bg-slate-800 border dark:border-slate-700 rounded-2xl text-sm outline-none dark:text-white focus:ring-2 focus:ring-emerald-500">
                                <option value="income">💰 Receita (+)</option>
                                <option value="expense" selected>📉 Despesa (-)</option>
                            </select>
                            
                            <input id="inDesc" type="text" placeholder="Descrição" 
                                   class="w-full p-3 bg-slate-50 dark:bg-slate-800 border dark:border-slate-700 rounded-2xl text-sm outline-none dark:text-white focus:ring-2 focus:ring-emerald-500">
                            
                            <div class="grid grid-cols-2 gap-2">
                                <input id="inVal" type="number" placeholder="Valor" step="0.01"
                                       class="p-3 bg-slate-50 dark:bg-slate-800 border dark:border-slate-700 rounded-2xl text-sm outline-none dark:text-white focus:ring-2 focus:ring-emerald-500">
                                <input id="inParc" type="number" placeholder="Parcelas" min="1" max="24"
                                       class="p-3 bg-slate-50 dark:bg-slate-800 border dark:border-slate-700 rounded-2xl text-sm outline-none dark:text-white focus:ring-2 focus:ring-emerald-500">
                            </div>
                            
                            <div class="grid grid-cols-2 gap-2">
                                <select id="inCat" class="p-3 bg-slate-50 dark:bg-slate-800 border dark:border-slate-700 rounded-2xl text-xs dark:text-white focus:ring-2 focus:ring-emerald-500"></select>
                                <select id="inMeth" class="p-3 bg-slate-50 dark:bg-slate-800 border dark:border-slate-700 rounded-2xl text-xs dark:text-white focus:ring-2 focus:ring-emerald-500"></select>
                            </div>
                            
                            <!-- Inputs para nova categoria/método -->
                            <div class="grid grid-cols-2 gap-2 pt-2">
                                <div>
                                    <input id="newCat" type="text" placeholder="Nova categoria" 
                                           class="w-full p-2 text-[10px] bg-slate-50 dark:bg-slate-800 border rounded-xl">
                                    <button onclick="addItemLista('categorias', 'newCat')" 
                                            class="w-full mt-1 text-[8px] bg-slate-200 dark:bg-slate-700 py-1 rounded-lg hover:bg-slate-300 transition">
                                        + Adicionar
                                    </button>
                                </div>
                                <div>
                                    <input id="newMeth" type="text" placeholder="Novo método" 
                                           class="w-full p-2 text-[10px] bg-slate-50 dark:bg-slate-800 border rounded-xl">
                                    <button onclick="addItemLista('metodos', 'newMeth')" 
                                            class="w-full mt-1 text-[8px] bg-slate-200 dark:bg-slate-700 py-1 rounded-lg hover:bg-slate-300 transition">
                                        + Adicionar
                                    </button>
                                </div>
                            </div>
                            
                            <div class="grid grid-cols-2 gap-2">
                                <select id="inMonth" class="p-3 bg-slate-50 dark:bg-slate-800 border dark:border-slate-700 rounded-2xl text-xs dark:text-white focus:ring-2 focus:ring-emerald-500"></select>
                                <input id="inYear" type="number" class="p-3 bg-slate-50 dark:bg-slate-800 border dark:border-slate-700 rounded-2xl text-xs dark:text-white focus:ring-2 focus:ring-emerald-500">
                            </div>
                            
                            <button onclick="adicionar()" id="btnSave" 
                                    class="w-full bg-slate-900 dark:bg-emerald-600 text-white font-bold py-4 rounded-2xl hover:bg-black dark:hover:bg-emerald-500 transition-all hover:scale-[1.02] text-[10px] uppercase tracking-widest shadow-xl">
                                SALVAR NA NUVEM
                            </button>
                            
                            <button id="btnCancelEdit" onclick="resetForm()" 
                                    class="hidden w-full bg-slate-200 dark:bg-slate-700 text-slate-600 dark:text-slate-300 font-bold py-3 rounded-xl text-[9px] uppercase hover:bg-slate-300 transition-all">
                                ← Cancelar Edição (ESC)
                            </button>
                        </div>
                    </div>

                    <!-- Card de Saldo -->
                    <div class="bg-white dark:bg-slate-900 p-6 rounded-3xl shadow-xl border border-slate-200 dark:border-slate-800 text-center">
                        <p class="text-[10px] uppercase tracking-widest text-slate-400 mb-2">Saldo do período</p>
                        <h2 id="totalBalance" class="text-4xl font-black text-slate-900 dark:text-white tracking-tighter transition-colors">
                            R$ 0,00
                        </h2>
                        
                        <!-- Mini estatísticas -->
                        <div class="grid grid-cols-2 gap-2 mt-4 text-[10px]">
                            <div class="bg-emerald-50 dark:bg-emerald-900/20 p-2 rounded-xl">
                                <span class="text-emerald-600 dark:text-emerald-400 font-bold" id="totalReceitas">R$ 0</span>
                                <p class="text-slate-400">Receitas</p>
                            </div>
                            <div class="bg-rose-50 dark:bg-rose-900/20 p-2 rounded-xl">
                                <span class="text-rose-600 dark:text-rose-400 font-bold" id="totalDespesas">R$ 0</span>
                                <p class="text-slate-400">Despesas</p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Coluna Direita - Tabela -->
                <div class="lg:col-span-2 bg-white dark:bg-slate-900 p-6 rounded-3xl shadow-xl border border-slate-200 dark:border-slate-800">
                    <!-- Filtros -->
                    <div class="flex flex-wrap justify-between items-center mb-6 border-b dark:border-slate-800 pb-4">
                        <h3 class="font-bold text-slate-800 dark:text-slate-200 flex items-center gap-2">
                            📋 Histórico
                            <span class="text-[8px] bg-slate-100 dark:bg-slate-800 px-2 py-1 rounded-full" id="contadorRegistros">0</span>
                        </h3>
                        
                        <div class="flex flex-wrap gap-2">
                            <input type="text" placeholder="🔍 Buscar..." onkeyup="filtrarTabela(this.value)"
                                   class="p-2 border dark:border-slate-700 rounded-xl text-xs bg-slate-50 dark:bg-slate-800 dark:text-white w-32 md:w-48">
                            
                            <select id="fMonth" onchange="render()" class="p-2 border dark:border-slate-700 rounded-xl text-xs bg-slate-50 dark:bg-slate-800 dark:text-white"></select>
                            <input id="fYear" type="number" onchange="render()" class="p-2 border dark:border-slate-700 rounded-xl text-xs w-20 bg-slate-50 dark:bg-slate-800 dark:text-white">
                        </div>
                    </div>

                    <!-- Tabela -->
                    <div class="overflow-x-auto no-scrollbar" style="max-height: 500px; overflow-y: auto;">
                        <table class="w-full text-left">
                            <tbody id="tableBody" class="divide-y divide-slate-100 dark:divide-slate-800"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>

    <!-- Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCBiRF-ISTjYVBv6F1TtCNGpfYWChExVtI",
            authDomain: "meufinanceiro-75b8e.firebaseapp.com",
            projectId: "meufinanceiro-75b8e",
            storageBucket: "meufinanceiro-75b8e.firebasestorage.app",
            messagingSenderId: "1083437842303",
            appId: "1:1083437842303:web:0c6f76428a738aedffa44a"
        };

        const app = initializeApp(firebaseConfig);
        window.auth = getAuth(app);
        window.db = getFirestore(app);
        window.fb_funcs = { signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut, doc, setDoc, getDoc };
    </script>
    <script src="app.js"></script>
</body>
</html>
