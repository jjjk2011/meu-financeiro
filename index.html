<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financeiro Pro Cloud</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        }
    </script>
    <style>
        #authScreen { display: flex; }
        #appScreen { display: none; }
        .loading { opacity: 0.5; pointer-events: none; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 transition-colors duration-300">

    <div id="authScreen" class="fixed inset-0 bg-slate-900 z-50 flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-3xl shadow-2xl max-w-sm w-full text-center">
            <h1 class="font-black text-2xl text-slate-800 mb-2 uppercase italic">Financeiro Pro</h1>
            <p class="text-[10px] text-slate-400 mb-6 uppercase font-bold tracking-widest">Acesse sua conta</p>
            <input id="authEmail" type="email" placeholder="E-mail" class="w-full p-3 bg-slate-50 border rounded-2xl mb-3 outline-none text-sm text-slate-800">
            <input id="authPass" type="password" placeholder="Senha" class="w-full p-3 bg-slate-50 border rounded-2xl mb-4 outline-none text-sm text-slate-800">
            <div class="flex gap-2">
                <button onclick="handleLogin()" class="flex-grow bg-blue-600 text-white font-bold py-3 rounded-xl hover:bg-blue-700 transition text-xs uppercase">Entrar</button>
                <button onclick="handleSignup()" class="flex-grow bg-slate-100 text-slate-600 font-bold py-3 rounded-xl hover:bg-slate-200 transition text-xs uppercase">Cadastrar</button>
            </div>
        </div>
    </div>

    <div id="appScreen" class="p-4 md:p-8">
        <div class="max-w-6xl mx-auto">
            
            <div class="bg-slate-800 dark:bg-slate-900 text-white p-6 mb-6 rounded-3xl flex flex-wrap justify-between items-center gap-4 shadow-xl">
                <div>
                    <h1 class="font-black text-xl text-emerald-400 uppercase tracking-tighter">Cloud Finance</h1>
                    <p id="userDisplay" class="text-[10px] opacity-60 uppercase font-bold tracking-widest italic"></p>
                </div>
                <div class="flex flex-wrap gap-2">
                    <button onclick="toggleDarkMode()" class="bg-slate-700 hover:bg-slate-600 px-3 py-2 rounded-xl text-sm transition">🌓</button>
                    <button onclick="exportarPDF()" class="bg-emerald-600 hover:bg-emerald-700 px-4 py-2 rounded-xl text-[10px] font-bold uppercase transition">PDF</button>
                    <label class="bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded-xl text-[10px] font-bold cursor-pointer uppercase transition">
                        Importar
                        <input type="file" class="hidden" onchange="importarParaNuvem(event)">
                    </label>
                    <button onclick="handleLogout()" class="bg-rose-600 hover:bg-rose-700 px-4 py-2 rounded-xl text-[10px] font-bold uppercase transition">Sair</button>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <div class="lg:col-span-1 space-y-6">
                    <div class="bg-white dark:bg-slate-900 p-6 rounded-3xl shadow-sm border border-slate-200 dark:border-slate-800 text-center">
                        <div class="grid grid-cols-2 gap-2 mb-4">
                            <div class="bg-emerald-50 dark:bg-emerald-900/20 p-3 rounded-2xl">
                                <span id="totalIncome" class="font-bold text-emerald-700 dark:text-emerald-400 text-sm">R$ 0,00</span>
                            </div>
                            <div class="bg-rose-50 dark:bg-rose-900/20 p-3 rounded-2xl">
                                <span id="totalExpense" class="font-bold text-rose-700 dark:text-rose-400 text-sm">R$ 0,00</span>
                            </div>
                        </div>
                        <h2 id="totalBalance" class="text-3xl font-black text-slate-900 dark:text-white tracking-tighter">R$ 0,00</h2>
                    </div>

                    <div class="bg-white dark:bg-slate-900 p-6 rounded-3xl shadow-sm border border-slate-200 dark:border-slate-800">
                        <h3 class="font-bold mb-4 text-slate-800 dark:text-slate-200 uppercase text-[10px] tracking-widest border-b dark:border-slate-800 pb-2">Novo Registro</h3>
                        <div class="space-y-3">
                            <select id="inType" class="w-full p-3 bg-slate-50 dark:bg-slate-800 border dark:border-slate-700 rounded-2xl text-sm outline-none dark:text-white">
                                <option value="income">Receita (+)</option>
                                <option value="expense" selected>Despesa (-)</option>
                            </select>
                            <input id="inDesc" type="text" placeholder="Descrição" class="w-full p-3 bg-slate-50 dark:bg-slate-800 border dark:border-slate-700 rounded-2xl text-sm outline-none dark:text-white">
                            <div class="grid grid-cols-2 gap-2">
                                <input id="inVal" type="number" placeholder="Valor" class="p-3 bg-slate-50 dark:bg-slate-800 border dark:border-slate-700 rounded-2xl text-sm outline-none dark:text-white">
                                <input id="inParc" type="number" placeholder="Parc." class="p-3 bg-slate-50 dark:bg-slate-800 border dark:border-slate-700 rounded-2xl text-sm outline-none dark:text-white">
                            </div>
                            <div class="grid grid-cols-2 gap-2">
                                <select id="inCat" class="p-3 bg-slate-50 dark:bg-slate-800 border dark:border-slate-700 rounded-2xl text-xs dark:text-white"></select>
                                <select id="inMeth" class="p-3 bg-slate-50 dark:bg-slate-800 border dark:border-slate-700 rounded-2xl text-xs dark:text-white"></select>
                            </div>
                            <div class="grid grid-cols-2 gap-2">
                                <select id="inMonth" class="p-3 bg-slate-50 dark:bg-slate-800 border dark:border-slate-700 rounded-2xl text-xs dark:text-white"></select>
                                <input id="inYear" type="number" class="p-3 bg-slate-50 dark:bg-slate-800 border dark:border-slate-700 rounded-2xl text-xs dark:text-white">
                            </div>
                            <button onclick="adicionar()" id="btnSave" class="w-full bg-slate-900 dark:bg-emerald-600 text-white font-bold py-4 rounded-2xl hover:bg-black dark:hover:bg-emerald-500 transition text-[10px] uppercase tracking-widest shadow-lg">Salvar na Nuvem</button>
                        </div>
                    </div>
                </div>

                <div class="lg:col-span-2 bg-white dark:bg-slate-900 p-6 rounded-3xl shadow-sm border border-slate-200 dark:border-slate-800">
                    <div class="flex justify-between items-center mb-6 border-b dark:border-slate-800 pb-4">
                        <h3 class="font-bold text-slate-800 dark:text-slate-200">Histórico</h3>
                        <div class="flex gap-2">
                            <select id="fMonth" onchange="render()" class="p-2 border dark:border-slate-700 rounded-xl text-xs bg-slate-50 dark:bg-slate-800 dark:text-white"></select>
                            <input id="fYear" type="number" onchange="render()" class="p-2 border dark:border-slate-700 rounded-xl text-xs w-20 bg-slate-50 dark:bg-slate-800 dark:text-white">
                        </div>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left">
                            <tbody id="tableBody" class="divide-y divide-slate-50 dark:divide-slate-800"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCBiRF-ISTjYVBv6F1TtCNGpfYWChExVtI",
            authDomain: "meufinanceiro-75b8e.firebaseapp.com",
            projectId: "meufinanceiro-75b8e",
            storageBucket: "meufinanceiro-75b8e.firebasestorage.app",
            messagingSenderId: "1083437842303",
            appId: "1:1083437842303:web:0c6f76428a738aedffa44a"
        };

        const app = initializeApp(firebaseConfig);
        window.auth = getAuth(app);
        window.db = getFirestore(app);
        window.fb_funcs = { signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut, doc, setDoc, getDoc };
    </script>
    <script src="app.js"></script>
</body>
</html>
