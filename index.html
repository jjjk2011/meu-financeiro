<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Financeiro Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-900 p-4">

    <div class="max-w-6xl mx-auto">
        <div class="bg-slate-800 text-white p-6 mb-6 rounded-3xl flex flex-wrap justify-between items-center gap-4 shadow-xl">
            <div>
                <h1 class="font-black text-xl text-emerald-400">FINANCEIRO PRO</h1>
                <p class="text-[10px] opacity-60 uppercase tracking-widest">Gestão de Backup e Dados</p>
            </div>
            <div class="flex gap-3">
                <button onclick="exportarBackup()" class="bg-emerald-600 hover:bg-emerald-700 px-5 py-2.5 rounded-2xl text-xs font-bold transition uppercase">Exportar</button>
                <label class="bg-blue-600 hover:bg-blue-700 px-5 py-2.5 rounded-2xl text-xs font-bold cursor-pointer transition uppercase">
                    Importar Backup
                    <input type="file" class="hidden" onchange="importarBackup(event)">
                </label>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            
            <div class="lg:col-span-1 space-y-4">
                <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200">
                    <p class="text-[10px] font-bold text-slate-400 uppercase mb-4">Resumo do Mês</p>
                    <div class="space-y-3">
                        <div class="flex justify-between items-center">
                            <span class="text-xs text-slate-500 font-medium">Entradas:</span>
                            <span id="totalIncome" class="font-bold text-emerald-500">R$ 0,00</span>
                        </div>
                        <div class="flex justify-between items-center">
                            <span class="text-xs text-slate-500 font-medium">Saídas:</span>
                            <span id="totalExpense" class="font-bold text-rose-500">R$ 0,00</span>
                        </div>
                        <div class="pt-3 border-t flex justify-between items-center text-lg">
                            <span class="font-bold text-slate-700 text-sm">Líquido:</span>
                            <span id="totalBalance" class="font-black text-slate-900">R$ 0,00</span>
                        </div>
                    </div>
                </div>

                <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200">
                    <h3 class="font-bold mb-4 text-slate-800">Novo Registro</h3>
                    <div class="space-y-3">
                        <select id="inType" class="w-full p-3 bg-slate-50 border rounded-2xl text-sm outline-none">
                            <option value="income">Receita (+)</option>
                            <option value="expense" selected>Despesa (-)</option>
                        </select>
                        <input id="inDesc" type="text" placeholder="Ex: Salário, Aluguel..." class="w-full p-3 bg-slate-50 border rounded-2xl text-sm outline-none">
                        <div class="grid grid-cols-2 gap-2">
                            <input id="inVal" type="number" placeholder="Valor" class="p-3 bg-slate-50 border rounded-2xl text-sm outline-none">
                            <input id="inParc" type="number" placeholder="Parc." class="p-3 bg-slate-50 border rounded-2xl text-sm outline-none">
                        </div>
                        <select id="inCat" class="w-full p-3 bg-slate-50 border rounded-2xl text-sm outline-none"></select>
                        <select id="inMeth" class="w-full p-3 bg-slate-50 border rounded-2xl text-sm outline-none"></select>
                        <div class="grid grid-cols-2 gap-2">
                            <select id="inMonth" class="p-3 bg-slate-50 border rounded-2xl text-xs outline-none"></select>
                            <input id="inYear" type="number" class="p-3 bg-slate-50 border rounded-2xl text-xs outline-none">
                        </div>
                        <button onclick="adicionar()" class="w-full bg-slate-900 text-white font-bold py-4 rounded-2xl hover:bg-black transition shadow-lg">ADICIONAR</button>
                    </div>
                </div>
            </div>

            <div class="lg:col-span-2 bg-white p-6 rounded-3xl shadow-sm border border-slate-200">
                <div class="flex flex-wrap justify-between items-center mb-6 gap-3">
                    <h3 class="font-bold text-lg">Histórico Mensal</h3>
                    <div class="flex gap-2">
                        <select id="fMonth" onchange="render()" class="p-2 border rounded-xl text-xs bg-slate-50 outline-none"></select>
                        <input id="fYear" type="number" onchange="render()" class="p-2 border rounded-xl text-xs w-20 bg-slate-50 outline-none">
                        <button onclick="limparTudo()" class="text-rose-500 font-bold text-[10px] hover:bg-rose-50 px-3 rounded-xl transition">LIMPAR</button>
                    </div>
                </div>
                
                <div class="overflow-x-auto">
                    <table class="w-full text-left">
                        <thead>
                            <tr class="text-[10px] text-slate-400 uppercase font-bold border-b">
                                <th class="pb-3 text-center">Status</th>
                                <th class="pb-3">Descrição</th>
                                <th class="pb-3 text-right">Valor</th>
                                <th class="pb-3 text-right"></th>
                            </tr>
                        </thead>
                        <tbody id="tableBody" class="divide-y divide-slate-50"></tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
